<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e9d8">
  <title>Bakery</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">🥖</span><span class="brand-name" id="brandName"></span></div>
        <button class="btn btn-sm lang-btn" id="langBtn" data-i18n="lang_switch" type="button"></button>
      </div>
      <div class="hero-body">
        <h1 id="shopName"></h1>
        <p id="tagline"></p>
      </div>
    </div>
  </header>

  <main class="wrap page-pad">
    <div id="closedBanner" class="banner banner-closed hidden" data-i18n="shop_closed"></div>
    <div id="days"></div>
    <h2 class="section-title" id="menuTitle" data-i18n="menu_title"></h2>
    <div id="grid" class="grid" aria-live="polite"><p class="muted" data-i18n="loading"></p></div>
    <div class="footer">
      <a href="#" id="trackLink" data-i18n="track_link"></a>
    </div>
  </main>

  <div class="cart-bar hidden" id="cartBar">
    <button class="btn btn-primary" id="cartBtn" type="button">
      <span><span class="cart-count" id="cartCount"></span> <span data-i18n="view_order"></span></span>
      <span id="cartTotal"></span>
    </button>
  </div>

  <div id="sheetRoot"></div>
  <script type="module" src="/shop.js"></script>
</body>
</html>
